{% extends 'base.html' %}

{% block head %}
{% endblock %}

{% block body %}

<div class="content">

    <h1 style="text-align: center">Update Task</h1>

    {% if errors %}
        <div class="error">
            {% for error in errors %}
                <p>{{ error }}</p>
            {% endfor %}
        </div>
    {% endif %}

    <div class="form">

        <form action="/update/{{ task.id }}" method="POST">

            <input
                type="text"
                name="content"
                id="content"
                value="{{ task.content }}"
                maxlength="200"
                required
            >

            <input type="submit" value="Update">

        </form>

    </div>

</div>

{% endblock %}
```
